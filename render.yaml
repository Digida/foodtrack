# Render Blueprint — FoodTrack Deployment
# https://render.com/docs/blueprint-spec

services:
  # ── Backend API + Frontend ──────────────────────────────────
  - type: web
    name: foodtrack-api
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn run:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodtrack-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: SITE_URL
        value: https://foodtrack.onrender.com
      - key: PYTHON_VERSION
        value: 3.12.0
    healthCheckPath: /health

databases:
  # ── PostgreSQL Database ─────────────────────────────────────
  - name: foodtrack-db
    region: frankfurt
    plan: starter
    databaseName: foodtrack
    user: foodtrack
    version: "16"
    ipAllowList: []